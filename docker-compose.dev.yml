services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: research-agent-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/logs:/app/logs
    depends_on:
      - mongo
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  mongo:
    image: mongo:8.2
    container_name: research-agent-mongo
    restart: unless-stopped
    env_file:
      - ./mongo/.env
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"   # Compass 접속용
    networks:
      - app-network

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile.dev
    container_name: research-agent-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - app-network
    volumes:
      # React 빌드 결과물 마운트 (사전에 npm run build 필요)
      - ./frontend/dist:/usr/share/nginx/html:ro

volumes:
  mongo_data:

networks:
  app-network:
    driver: bridge

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 트렌드 분석 어시스턴트 - 로그인</title>
    <link rel="stylesheet" href="/styles.css">
    <!-- 환경 변수 설정 (inject-env.js 스크립트로 자동 주입됨) -->
    <script>
        // .env 파일에서 읽어온 값 (기본값: http://localhost:8000)
        window.__ENV__ = {
            API_BASE_URL: 'http://localhost:8000'
        };
    </script>
</head>
<body>
    <!-- 렌딩 페이지 -->
    <div id="landingPage" class="landing-page">
        <div class="landing-content">
            <h1 class="landing-title">🤖 AI 트렌드 분석 어시스턴트</h1>
            <p class="landing-description">
                연구/기술/산업 등의 <strong>최신 트렌드</strong>를 분석하여 종합 보고서를 제공하는 AI 어시스턴트입니다.
            </p>
            
            <div class="landing-features">
                <div class="landing-feature-item">
                    <span class="landing-feature-icon">🔍</span>
                    <div>
                        <h3>요구사항 명확화</h3>
                        <p>대화를 통해 분석하고 싶은 주제와 범위를 명확히 파악합니다.</p>
                    </div>
                </div>
                <div class="landing-feature-item">
                    <span class="landing-feature-icon">📚</span>
                    <div>
                        <h3>자료 수집</h3>
                        <p>웹 검색과 학술 논문 검색(ArXiv)을 통해 <strong>최신 정보</strong>를 수집합니다.</p>
                    </div>
                </div>
                <div class="landing-feature-item">
                    <span class="landing-feature-icon">✍️</span>
                    <div>
                        <h3>보고서 작성</h3>
                        <p>수집된 자료를 바탕으로 테이블, 다이어그램, 출처가 포함된 마크다운 보고서를 생성합니다.</p>
                    </div>
                </div>
            </div>
            
            <div class="landing-actions">
                <button id="loginBtn" class="landing-btn landing-btn-primary">로그인</button>
                <button id="signupBtn" class="landing-btn landing-btn-secondary">회원가입</button>
            </div>
        </div>
    </div>

    <!-- 로그인 모달 -->
    <div id="loginModal" class="modal">
        <div class="modal-content">
            <h2>로그인</h2>
            <input 
                type="text" 
                id="loginNameInput" 
                placeholder="demo: test"
                autocomplete="off"
            >
            <div class="modal-actions">
                <button id="loginSubmit" class="modal-btn">로그인</button>
                <button id="loginCancel" class="modal-btn modal-btn-secondary">취소</button>
            </div>
        </div>
    </div>

    <!-- 회원가입 모달 -->
    <div id="signupModal" class="modal">
        <div class="modal-content">
            <h2>회원가입</h2>
            <input 
                type="text" 
                id="signupNameInput" 
                placeholder="유저 이름을 입력하세요"
                autocomplete="off"
            >
            <input 
                type="password" 
                id="signupPasswordInput" 
                placeholder="비밀번호를 입력하세요"
                autocomplete="off"
            >
            <div class="modal-actions">
                <button id="signupSubmit" class="modal-btn">회원가입</button>
                <button id="signupCancel" class="modal-btn modal-btn-secondary">취소</button>
            </div>
        </div>
    </div>
    
    <!-- 스크립트 로드 -->
    <script src="/landing.js"></script>
</body>
</html>
